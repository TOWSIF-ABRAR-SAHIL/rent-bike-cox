name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'style:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK" --fail-with-body
          echo "Render deploy triggered"
      - name: No Render deploy hook configured
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK not set; relying on Render GitHub integration"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'style:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          cd frontend-next
          npx -y vercel@latest link --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID" --yes
          npx -y vercel@latest deploy --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --prod --yes
      - name: No Vercel prod project configured
        if: env.VERCEL_TOKEN == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "VERCEL_TOKEN or VERCEL_PROJECT_ID not set; relying on Vercel GitHub integration"

  deploy-frontend-next:
    name: Deploy Frontend-Next Preview to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_NEXT: ${{ secrets.VERCEL_PROJECT_ID_NEXT }}
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'style:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy preview to Vercel
        if: env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID_NEXT != ''
        run: |
          cd frontend-next
          npx -y vercel@latest link --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID_NEXT" --yes
          npx -y vercel@latest deploy --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes
      - name: No preview project configured
        if: env.VERCEL_TOKEN == '' || env.VERCEL_PROJECT_ID_NEXT == ''
        run: echo "VERCEL_PROJECT_ID_NEXT not set; create a second Vercel project with root frontend-next and add its project ID as a secret"
