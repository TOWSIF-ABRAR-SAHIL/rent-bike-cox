name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    if: >-
      !contains(github.event.head_commit.message, 'docs:') &&
      !contains(github.event.head_commit.message, 'style:') &&
      !contains(github.event.head_commit.message, 'chore:')
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK" --fail-with-body
          echo "Render deploy triggered"
      - name: No Render deploy hook configured
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK not set; relying on Render GitHub integration"

  # NOTE: both Vercel projects (rent-bike-cox prod, rent-bike-next preview)
  # auto-deploy via the Vercel GitHub integration on every push to main.
  # The CLI-based jobs were removed: `vercel deploy` from CI cannot target a
  # project whose Root Directory equals the deploy directory (path-doubling
  # bug), and amondnet/vercel-action@v25 pins a CLI rejected by the API.
  # VERCEL_* secrets are kept for manual CLI/API use.
