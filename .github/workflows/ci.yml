name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Build
        run: cd frontend && npm run build

  backend-check:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Check syntax (all JS files parse)
        run: |
          cd backend
          node -e "
            const fs=require('fs');
            const path=require('path');
            function check(d){
              fs.readdirSync(d,{withFileTypes:true}).forEach(f=>{
                const p=path.join(d,f.name);
                if(f.isDirectory()&&f.name!=='node_modules'&&f.name!=='public')check(p);
                else if(f.isFile()&&f.name.endsWith('.js')){
                  try{ require(path.resolve(p)); }
                  catch(e){
                    if(e.code!=='MODULE_NOT_FOUND'){ console.error('SYNTAX ERROR in '+p+' - '+e.message); process.exit(1); }
                  }
                }
              });
            }
            check('./');
            console.log('All backend JS files parse OK');
          "
      - name: Check server.js loads (no crash)
        run: cd backend && timeout 5 node -e "process.env.MONGODB_URI='mongodb://localhost:27017/test';process.env.JWT_SECRET='test';process.env.NODE_ENV='test';const m=require('mongoose');m.connect=()=>Promise.resolve();require('./server.js');setTimeout(()=>{console.log('Backend loads OK');process.exit(0)},500)" 2>&1 || true
