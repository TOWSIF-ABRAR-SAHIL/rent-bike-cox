<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Rent Bike Cox's Bazar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0a0a0f;
        color: #e5e7eb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 420px;
        padding: 40px 32px;
        background: rgba(13, 13, 20, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        backdrop-filter: blur(20px);
      }
      .icon { font-size: 64px; margin-bottom: 20px; }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #f59e0b; }
      p { font-size: 15px; color: #9ca3af; line-height: 1.6; margin-bottom: 28px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        background: linear-gradient(135deg, #f59e0b, #ea580c);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3); }
      .btn:active { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>No internet connection detected. Some features may be unavailable. Please check your network and try again.</p>
      <button class="btn" onclick="window.location.reload()">↻ Try Again</button>
    </div>
  </body>
</html>
