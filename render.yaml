services:
  - type: web
    name: rent-bike-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Required: the server refuses to boot in production without it, because
      # NID / driving licence / phone are otherwise stored in cleartext.
      # Generate with: openssl rand -hex 32   (then set the value in the dashboard)
      - key: ENCRYPTION_KEY
        sync: false
      # Optional pepper for nidHash / phoneHash duplicate detection; falls back to
      # ENCRYPTION_KEY when unset. Rotating it invalidates existing hashes.
      - key: PII_HASH_PEPPER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASS
        sync: false
      - key: SSLCOMMERZ_IS_LIVE
        value: "false"
      - key: BACKEND_URL
        sync: false
      - key: FRONTEND_URL
        value: https://rent-bike-cox.vercel.app
